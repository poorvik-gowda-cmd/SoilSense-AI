services:
  - type: web
    name: soilsense-api
    env: python
    buildCommand: pip install -r requirements.txt && python -m ml.train
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
